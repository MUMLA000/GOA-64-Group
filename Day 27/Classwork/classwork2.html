<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Internal CSS მაგალითი</title>

    <style>
        /* 1 წესით ვასტილებთ h1 და h2 ელემენტებს */
        h1, h2 {
            color: white;
            background-color: darkblue;
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 10px;
            border-radius: 8px;
        }

        /* 2 წესით ვასტილებთ div-ში არსებულ ყველა p ელემენტს */
        div p {
            color: darkgray;
            background-color: lightgrey;
            font-size: 18px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid lightgray;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h1>ეს არის პირველი სათაური</h1>
    <h2>ეს არის მეორე სათაური</h2>

    <div>
        <p>ეს არის პირველი აბზაცი div-ში.</p>
        <p>ეს არის მეორე აბზაცი div-ში.</p>
    </div>

</body>
</html>
