<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 4) ელემენტის selector — ყველაზე სუსტი */
        p {
            color: green;
        }
        /* 3) კლასის selector — უფრო ძლიერი */
        .text {
        color: blue;
        }
        /* 2) ID selector — უფრო ძლიერი */
        #main {
        color: red;
        }
    </style>
</head>
<body>
    <!-- 1) Inline style — ყველაზე ძლიერი -->
    <p id="main" class="text" style="color: blueviolet;">ტექსტი</p>
</body>
</html>
