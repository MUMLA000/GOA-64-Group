<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main</title>
    <style>
/* უკანა ფონის სტილი */
    body {
        margin: 1;
        background: linear-gradient(to right, #e0eafc, #cfdef3);
        color: #333;
    }
/* დასაწყისი */
    header {
        background-color: #2c3e50;
        color: white;
        padding: 2rem;
        text-align: center;
    }
/* სათაურის სტილი */
    h1 {
        margin: 0;
        font-size: 2.5rem;
    }
/* პარაგრაფების სტილი */
    p {
        font-size: 1.2rem;
        margin-top: 0.5rem;
    }
/* navigation */
    nav {
        margin: 2rem auto;
        text-align: center;
    }
/* list სისტემა */
    ul {
        list-style: none;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1.5rem;
    }
    ul li {
        background-color: white;
        border-radius: 10px;
        padding: 1rem 2rem;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        transition: 0,2s;
    }
    ul li a {
        color: #2c3e50;
        font-size: 1.5rem;
        font-weight: bold;
    }

    /* ბოლო ნაწილი */
    footer {
        text-align: center;
        padding: 1rem;
        margin-top: 3rem;
        color: #777;
    }
    </style>
</head>
<body>
    <header>
        <!-- შესავალი -->
        <h1>მოიძიე ევროპული ქვეყნები</h1>
        <p>დააჭირე ქვეყანას რომ გაიგო მეტი</p>
    </header>
    <nav>
        <!-- list of countries -->
    <ul>

        <li><a href="italy.html">იტალია</a></li>
        <li><a href="spain.html">ესპანეთი</a></li>
        <li><a href="germany.html">გერმანია</a></li>
        <li><a href="belgium.html">ბელგია</a></li>
    </ul>
    </nav>
    <footer>
        &copy; 2025 ევროპული ქვეყნების პროექტი
    </footer>
</body>
</html>
