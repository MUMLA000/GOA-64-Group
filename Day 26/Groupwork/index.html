<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(to right, #e0eafc, #cfdef3);
        color: #333;
    }
    header {
        background-color: #2c3e50;
        color: white;
        padding: 2rem;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
        margin: 0;
        font-size: 2.5rem;
    }
    p.description {
        font-size: 1.2rem;
        margin-top: 0.5rem;
    }
    nav {
        margin: 2rem auto;
        text-align: center;
    }
    ul.country-list {
        list-style: none;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1.5rem;
    }
    ul.country-list li {
        background-color: white;
        border-radius: 10px;
        padding: 1rem 2rem;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s, box-shadow 0.2s;
    }
    ul.country-list li:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
    }
    ul.country-list li a {
        text-decoration: none;
        color: #2c3e50;
        font-size: 1.2rem;
        font-weight: bold;
    }
    footer {
        text-align: center;
        padding: 1rem;
        margin-top: 3rem;
        color: #777;
    }
    </style>
</head>
<body>
    <header>
        <h1>მოიძიე ევროპული ქვეყნები</h1>
        <p class="description">დააჭირე ქვეყანას რომ გაიგე მეტი</p>
    </header>
    <nav>
    <ul class="country-list">
        <li><a href="france.html">საფრანგეთი</a></li>
        <li><a href="italy.html">იტალია</a></li>
        <li><a href="spain.html">ესპანეთი</a></li>
        <li><a href="germany.html">გერმანია</a></li>
        <li><a href="belgium.html">ბელგია</a></li>
    </ul>
    </nav>
    <footer>
        &copy; 2025 ევროპული ქვეყნების პროექტი
    </footer>
</body>
</html>
