ღილაკი და სურათი. თქვენთის სასურველი 3 ელემენტი გასტილეთ დამოუკიდებლად 
(ისე რომ კონკრეტულად ეს ელემენტი გაისტილოს) გამოიყენეთ id და CSS დაწერეთ Internal ტექნიკით -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            font-weight: 400;
        }
        
        h1 {background-color: aqua;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        p {
            background-color: aqua;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #header {
            color: blue;
        }

        #parragraph {
            color: blueviolet;
        }
    </style>
</head>
<body>
    <div id="h1">
        <h1 id="header">Example 1</h1>
    </div>
    <div id="p">
        <p id="parragraph">Example 2</p>
    </div>
</body>
</html>
