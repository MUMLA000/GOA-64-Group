<!-- 2) გასტილეთ ვებგვერდზე ყველა h2 და h3 თქვენთვის ს
ასურველი CSS-ის დეკლარაციებით, 
ოღონდ გამოიყენეთ მხოლოდ 1 CSS-ის წესი (ესეიგი ერთად უნდა 
დაწეროთ selector-ში და დააცილოთ მძიმით), 
შემდეგ კი გასტილეთ ყველა
ღილაკი ცისფერი ფონის ფერით ვებგვერდზე ხოლო ის ღილაკები რომელბიც

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: green;
        }
        div h2 {
            font-family: sans-serif;
            background-color: cyan;
        }

        div h3 {
            font-family: sans-serif;
            background-color: cyan;
        }
    </style>
</head>
<body>
    <div>
        <h1>Header 1</h1>
        <h2>Header 2</h2>
        <h3>Header 3</h3>
    </div>
</body>
</html>
