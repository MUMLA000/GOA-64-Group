<!-- 1) შექმენით h1, p, button, img და 
შემდეგ გასტილეთ internal css-ის გზით:
თითოეულ ელემენტს შეუცვალეთ სტილი css-ის წესების
გამოყენებით. CSS-ის სინტაქსი ახსენით კომენტარებით.

/* CSS  COMMENT */ -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* h1-ისთვის CSS წესი სტილავს ყველა h1-ს, რომელიც დაწერილია body-ში */
        h1 {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: rgb(72, 23, 189);
        }

        /* p-ისთვის CSS წესი სტილავს ყველა p-ს, რომელიც დაწერილია body-ში */
        p {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: rgba(44, 55, 211, 0.678);
            background-color: aquamarine;
        }

        /* button-ისთვის CSS წესი სტილავს ყველა button-ს, რომელიც დაწერილია body-ში */
        button {
        color: #2c3e50;
        font-size: 1.5rem;
        font-weight: bold;
        }

        /* img-ისთვის CSS წესი სტილავს ყველა img-ს, რომელიც დაწერილია body-ში */
        img {
        margin: 0;
        background-color: cornflowerblue;
        color: #333;
        }


        /* font-size არის კუთვნილება */
        /* red არის მნიშნველობა */
        /* ამ ყველაფერს ერთად დეკლარაცია ეწოდება */
    </style>
</head>
<body>
    <h1>Classwork1</h1>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit.
        Amet, maiores ea voluptates impedit possimus perferendis ad! 
        Sit quod autem inventore iusto. Modi mollitia officiis debitis rerum molestias! 
        Assumenda, blanditiis quaerat!</p>
    <button>Click</button>
    <img src="example.jpg" alt="example">
</body>
</html>
